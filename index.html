<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<title>Comunica</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

:root {
  --sky-top: #d4eafb;
  --sky-bottom: #f7fbff;
  --yellow: #dca707;
  --yellow-dark: #ae8100;
  --navy: #092B3B;
  --navy-soft: #ffffff;
  --card: #123b4d;
  --card-border: rgba(212, 234, 251, 0.32);
  --green: #1c5873;
  --red: #1c5873;
  --white: #ffffff;
  --radius: 10px;
  --font: 'Manrope', sans-serif;
  --font-title: 'Manrope', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
   width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    background-color: #092B3B;
    color: var(--white);
}
#app {
    width: 100%;
    max-width: none;
    min-height: 100vh;
    border: none;
    outline: none;
    box-shadow: none;
}

body,.bg-outras{
    font-family: var(--font);
    background-image: url("../img/background.png");
    background-size: cover;
    background-position: top;
    background-repeat: no-repeat;
    background-attachment: fixed;
    
    color: var(--navy);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}



#app,
.app {
  width: 100%;
  max-width: 900px;
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: clamp(12px, 3vw, 32px);
}
.topbar{
  display: flex;
  gap: 0.5rem;
}

.topbar,
.app-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0 14px;
}

.topbar-title {
  font-family: var(--font-title);
  font-size: 18px;
  font-weight: 800;
  color: var(--white);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  text-align: center;
}

.icon-btn,
.profile-btn {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  color: var(--navy);
  box-shadow: 0 4px 8px rgba(23, 58, 94, 0.15);
  backdrop-filter: blur(5px);
  transition: transform 0.15s ease, background 0.15s ease;
}

.icon-btn:hover,
.profile-btn:hover {
  transform: scale(1.05);
}

.icon-btn:active,
.profile-btn:active {
  transform: scale(0.94);
}


.home-hero {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-top: 8px;
  margin-bottom: 12px;
}


.hero-cover-img {
  width: 100%;
  max-width: 430px;
  height: auto;
  display: block;
  border-radius: 18px;
  object-fit: contain;
}

.menu {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}

.home-screen {
  
  display: grid;
  justify-content: center;
  text-align: left;
  gap:2rem
}

.brand-intro {
  margin: 12px 0 26px;
}

.brand-intro h1 {
  margin: 0;
  color: var(--white);
  font-family: var(--font-title);
  font-size: clamp(30px, 7vw, 42px);
  font-weight: 800;
  letter-spacing: -0.045em;
}

.brand-intro p {
  margin: 7px 0 0;
  color: var(--white);
  font-size: 14px;
  font-weight: 500;
}

.menu-btn.primary,
.card.yellow,
.action-btn.primary {
  background: transparent;
  border-color: var(--card-border);
}

.menu-btn,
.card,
.word-card,
.phrase-card,
.profile-card,
.history-card {
  box-shadow: 0 4px 14px rgba(28, 88, 115, 0.09);
  
}

.topbar-title {
  color: var(--white);
  text-shadow: none;
}


.menu-btn,
.card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;

  border: 1.5px solid var(--card-border);
  border-radius: var(--radius);
  padding: 10px 14px;
  cursor: pointer;
  text-align: left;
  text-decoration: none;
  color: inherit;
  
 
  font-family: var(--font);
  backdrop-filter: blur(6px);
  transition: transform 0.1s ease, border-color 0.15s ease;
}

.menu-btn:hover,
.card:hover {
  transform: translateY(-2px);
}

.menu-btn:active,
.card:active {
  transform: scale(0.98);
}



.menu-emoji,
.card-icon {
  width: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  text-align: center;
}

.line-menu-icon {
  position: relative;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
}

.line-menu-icon::before,
.line-menu-icon::after {
  position: absolute;
  box-sizing: border-box;
  content: '';
}

.icon-message::before { inset: 4px 3px 7px; border: 2px solid var(--white); border-radius: 7px; }
.icon-message::after { bottom: 4px; left: 8px; width: 7px; height: 7px; border-bottom: 2px solid var(--white); border-left: 2px solid var(--white); transform: rotate(-45deg); }
.icon-favorite::before { inset: 0; color: var(--white); font-size: 31px; line-height: 28px; text-align: center; content: '☆'; }
.icon-library::before { top: 3px; left: 5px; width: 20px; height: 24px; border: 2px solid var(--white); border-radius: 3px; }
.icon-library::after { top: 9px; left: 10px; width: 10px; height: 2px; background: var(--white); box-shadow: 0 5px 0 var(--white), 0 10px 0 var(--white); }
.icon-settings::before { top: 7px; left: 7px; width: 16px; height: 16px; border: 2px solid var(--white); border-radius: 50%; box-shadow: 0 -6px 0 -4px var(--white), 0 6px 0 -4px var(--white), 6px 0 0 -4px var(--white), -6px 0 0 -4px var(--white); }
.icon-challenge::before { inset: 3px; border: 2px solid var(--white); border-radius: 50%; }
.icon-challenge::after { top: 12px; left: 12px; width: 6px; height: 6px; background: var(--white); border-radius: 50%; }

.profile-outline { position: relative; display: block; width: 20px; height: 20px; border: 2px solid var(--white); border-radius: 50%; }
.profile-outline::before, .profile-outline::after { position: absolute; left: 50%; box-sizing: border-box; content: ''; transform: translateX(-50%); }
.profile-outline::before { top: 3px; width: 6px; height: 6px; border: 1.5px solid var(--white); border-radius: 50%; }
.profile-outline::after { bottom: 2px; width: 11px; height: 6px; border: 1.5px solid var(--white); border-radius: 7px 7px 3px 3px; }

.app-line-icon {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: var(--white);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.8;
}

.menu-text,
.card-text {
  flex: 1;
}

.menu-title,
.card-text h3 {
  font-family: var(--font-title);
  font-size: 14px;
  line-height: 1.1;
  color: var(--white);
  font-weight: 800;
  margin: 0 0 2px;
}

.menu-sub,
.card-text p {
  font-size: 11px;
  line-height: 1.2;
  color: var(--navy-soft);
  font-weight: 600;
  margin: 0;
}

.menu-arrow,
.chevron {
  font-size: 20px;
  color: var(--navy-soft);
  margin-left: 6px;
}

.about-link {
  text-align: center;
  margin-top: 14px;
  font-size: 13px;
  font-weight: 800;
  color: #ffffff;
  cursor: pointer;
  text-decoration: none;
  letter-spacing: 0.3px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
}

.about-link:hover {
  text-decoration: underline;
}



.screen {
  width: 100%;
  padding: 4px 0 18px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.section-label {
  font-family: var(--font-title);
  font-size: 14px;
  font-weight: 800;
  color: var(--white);
  margin: 4px 0 10px;
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
}



.phrase-bar {
  width: 100%;
  background: #ffffff;
  border: 2px solid var(--card-border);
  border-radius: 16px;
  min-height: 60px;
  height: auto;
  padding: 8px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  align-content: center;
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 16px;
  box-shadow: 0 3px 8px rgba(23, 58, 94, 0.08);
}

.phrase-chip {
 
 
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  line-height: 1;
  font-weight: 800;
  white-space: nowrap;

}
.phrase-chip span{
  color: #092B3B;
}

.phrase-placeholder {
  color: #123b4d6c;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.3;
}


.layer-label {
  text-align: center;
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 13px;
  color: #ffffff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  margin-bottom: 14px;
  letter-spacing: 0.5px;
}

.carousel-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 18px;
  min-height: 190px;
}

.carousel-track {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  overflow: visible;
}

.carousel-arrow {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  border: 1px solid #dca707;
  border-radius: 50%;
  background: transparent;
  color: white;
  font-size: 24px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(23, 58, 94, 0.18);
  transition: transform 0.1s ease;
}

.carousel-arrow:active {
  transform: scale(0.9);
}

.carousel-arrow:disabled {
  opacity: 0.35;
  cursor: default;
}

.carousel-card {
  flex: 0 0 auto;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition:
    transform 0.18s ease,
    opacity 0.18s ease,
    border-color 0.18s ease,
    box-shadow 0.18s ease;
  backdrop-filter: blur(4px);
  user-select: none;
}

.carousel-card.side {
  width: 78px;
  height: 110px;
  opacity: 0.55;
  transform: scale(0.82);
}

.carousel-card.side .emoji {
  font-size: 26px;
}

.carousel-card.side .label {
  font-size: 11px;
}

.carousel-card.center {
  width: 120px;
  height: 150px;
  opacity: 1;
  transform: scale(1);
  border-color: var(--yellow-dark);
  background: var(--yellow);
  box-shadow: 0 6px 16px rgba(23, 58, 94, 0.25);
}

.carousel-card.center .emoji {
  font-size: 42px;
}

.carousel-card.center .label {
  font-size: 15px;
}

.carousel-card .emoji {
  line-height: 1;
}

.carousel-card .label {
  font-family: var(--font-title);
  font-weight: 800;
  text-align: center;
  color: var(--white);
  padding: 0 4px;
}

.carousel-card:hover {
  transform: scale(0.9);
}

.carousel-card.center:hover {
  transform: scale(1.04);
}

.carousel-card.empty {
  visibility: hidden;
}


.confirm-btn {
  width: 100%;
  background: var(--yellow);
  color: #ffffff;
  border: none;
  border-radius: 16px;
  padding: 14px;
  font-family: var(--font);
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 10px;
 border: 1px solid #ae8100;
  transition: transform 0.1s ease, opacity 0.15s ease;
}

.confirm-btn:active {
  transform: scale(0.98);
}

.confirm-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}


.action-row {
  width: 100%;
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
 
}

.action-row button {
  flex: 1;
  border:1px solid var(--card-border);
  background: transparent;
  color: white;
  border-radius: 12px;
  padding: 10px 6px;
  font-family: var(--font);
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  transition: transform 0.1s ease;
}

.action-row button:active {
  transform: scale(0.96);
}



.word-card {
  position: relative;
}

.favorite-toggle {
  position: absolute;
  top: 6px;
  right: 6px;
  border: 0;
  background: transparent;
  color: var(--navy);
  font-size: 18px;
  line-height: 1;
  padding: 2px;
  cursor: pointer;
}

.favorite-toggle.is-favorite {
  color: var(--yellow-dark);
}

.speak-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--navy);
  color: #ffffff;
  border: none;
  border-radius: 16px;
  padding: 14px;
  font-family: var(--font);
  font-weight: 800;
  font-size: 17px;
  cursor: pointer;
  margin-bottom: 14px;
  box-shadow: 0 4px 10px rgba(76, 175, 125, 0.35);
  transition: transform 0.1s ease, opacity 0.15s ease;
}

.speak-btn:active {
  transform: scale(0.98);
}

.speak-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.hint {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: #ffffff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  margin-top: auto;
  padding-top: 10px;
}



.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 6px;
  cursor: pointer;
  font-size: 14px;
  width: max-content;
  padding: 5px;
  border-radius: 20px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}

.back-link:hover {
  text-decoration: underline;
}

.cat-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.cat-card {
  background: transparent;
  border: 2px solid var(--card-border);
  border-radius: 18px;
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(23, 58, 94, 0.1);
  backdrop-filter: blur(4px);
  transition: transform 0.1s ease;
}

.cat-card:hover {
  transform: translateY(-2px);
}

.cat-card:active {
  transform: scale(0.97);
}

.cat-card .emoji {
  font-size: 34px;
  display: block;
  margin-bottom: 6px;
}

.cat-card .label {
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 14px;
  color: var(--white);
}

.cat-card .count {
  font-size: 11.5px;
  color: var(--navy-soft);
  font-weight: 600;
}



.word-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}

.word-card {
  min-height: 150px;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 12px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  cursor: pointer;
  font-family: var(--font);
  box-shadow: 0 3px 8px rgba(23, 58, 94, 0.1);
  backdrop-filter: blur(4px);
  transition:
    transform 0.1s ease,
    background 0.1s ease;
}

.word-card:hover {
  transform: translateY(-2px);
}

.word-card:active {
  transform: scale(0.95);
}

.word-card .emoji {
  font-size: 30px;
  line-height: 1;
}

.word-card .label {
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 14px;
  text-align: center;
  color: var(--white);
}

.word-card .description {
  font-size: 10px;
  color: var(--navy-soft);
  text-align: center;
  line-height: 1.15;
  padding: 0 4px;
}

.word-card.selected {
  background: var(--yellow);
  border-color: var(--yellow-dark);
}

.word-card::after {
  content: '☆';
  font-size: 18px;
  color: var(--navy);
  margin-top: 2px;
}



.fav-item {
  width: 100%;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 12px 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  backdrop-filter: blur(4px);
}

.fav-item .txt {
  flex: 1;
  font-weight: 700;
  color: var(--white);
}

.fav-item button {
  background: var(--yellow);
  border: none;
  border-radius: 10px;
  padding: 8px 10px;
  font-weight: 800;
  cursor: pointer;
  color: var(--navy);
}

.fav-remove {
  background: none !important;
  color: var(--red) !important;
  font-size: 16px;
}

.empty-state {
  text-align: center;
  color: #ffffff;
  font-weight: 700;
  padding: 40px 20px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}



.form-block {
  width: 100%;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
  backdrop-filter: blur(4px);
}

.form-block h3 {
  margin: 0 0 10px;
  font-family: var(--font-title);
  font-size: 15px;
  font-weight: 800;
  color: var(--white);
}

.form-row {
  width: 100%;
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.form-row input,
.form-row select {
  min-width: 0;
  flex: 1;
  border: 2px solid var(--card-border);
  border-radius: 10px;
  padding: 10px;
  font-family: var(--font);
  font-weight: 600;
  font-size: 14px;
  color: var(--white);
  background: #ffffff;
}

.form-row input:focus,
.form-row select:focus {
  outline: none;
  border-color: var(--yellow-dark);
}

.emoji-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.emoji-pick {
  font-size: 22px;
  background: #ffffff;
  border: 2px solid var(--card-border);
  border-radius: 10px;
  padding: 6px 8px;
  cursor: pointer;
  transition: transform 0.1s ease;
}

.emoji-pick:hover {
  transform: scale(1.05);
}

.emoji-pick.chosen {
  border-color: var(--yellow-dark);
  background: var(--sky-top);
}

.submit-btn {
  width: 100%;
  background: var(--navy);
  color: #ffffff;
  border: none;
  border-radius: 12px;
  padding: 12px;
  font-family: var(--font);
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.1s ease;
}

.submit-btn:active {
  transform: scale(0.98);
}

.custom-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.custom-chip {
  background: #ffffff;
  border: 1.5px solid var(--card-border);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.custom-chip span.x {
  color: var(--red);
  cursor: pointer;
  font-weight: 800;
}



.challenge-card {
  width: 100%;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 18px;
  padding: 20px;
  text-align: center;
  margin-bottom: 16px;
  backdrop-filter: blur(4px);
}

.challenge-card .emoji {
  font-size: 44px;
  line-height: 1;
}

.challenge-card p {
  font-weight: 700;
  font-size: 16px;
  color:white;
  margin-bottom: 0;
}

.stars {
  text-align: center;
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 18px;
  margin-bottom: 10px;
  color: var(--yellow);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}



.info-block {
  width: 100%;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
  font-weight: 600;
  line-height: 1.5;
  font-size: 14px;
  color: var(--navy);
  backdrop-filter: blur(4px);
}

.profile-stat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--card-border);
  font-weight: 700;
  color: var(--white);
}


.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: #ffffff;
  padding: 12px 20px;
  border-radius: 14px;
  font-weight: 700;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
  z-index: 50;
  opacity: 0;
  transition: opacity 0.25s ease;
  max-width: 90%;

function loadData() {

    const raw = localStorage.getItem(STORAGE_KEY);

    if (raw) {

      STATE.data = {

        ...STATE.data,

        ...parsed,

        profile: {
          ...STATE.data.profile,
          ...(parsed.profile || {})

  } catch (error) {

      'Erro ao carregar os dados:',
      error

  if (!STATE.data.profile.onboarded) {

    STATE.screen = 'login';

  }, 1800);

    new SpeechSynthesisUtterance(text);

  utterance.lang = 'pt-BR';

  const voices =
    window.speechSynthesis.getVoices();

  const ptVoice =
    voices.find(
      voice =>
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith('pt')
    );

  if (ptVoice) {

    utterance.voice = ptVoice;

  }

  window.speechSynthesis.cancel();

  window.speechSynthesis.speak(
    utterance
  );

}



function go(screen, extra = {}) {

  STATE.screen = screen;

  Object.assign(
    STATE,
    extra
  );

  if (screen !== 'challenge') {

    STATE.challenge = null;

  }

  if (screen !== 'profile') {

    STATE.layoutPromptVisible = false;

    STATE.editingProfileName = false;

  }

  render();

  window.scrollTo(
    0,
    0
  );

}



function addWordToPhrase(word) {

  if (!word) return;

  STATE.phrase.push(word);

  loadLayer();

  render();

}

function eraseLast() {

  if (STATE.phrase.length === 0) {

    showToast('Não há palavras para apagar.');

    return;

  }

  speak('Apagar');

  STATE.phrase.pop();

  loadLayer();

  render();

}

function clearPhrase() {

  if (STATE.phrase.length > 0) {

    speak('Limpar frase');

  }

  STATE.phrase = [];

  loadLayer();

  render();

}

function currentPhraseText() {

  return STATE.phrase
    .map(word => word.label)
    .join(' ');

}



function favoritePhrase() {

  if (STATE.phrase.length === 0) {

    showToast(
      'Monte uma frase primeiro.'
    );

    return;

  }

  const text =
    currentPhraseText();

  if (
    !STATE.data.favPhrases.includes(text)
  ) {

    STATE.data.favPhrases.push(text);

    saveData();

    showToast(
      'Frase adicionada aos favoritos '
    );

  } else {

    showToast(
      'Essa frase já está nos favoritos.'
    );

  }

  render();

}



function currentLayerKey() {

  const last =
    STATE.phrase[
      STATE.phrase.length - 1
    ];

  return last
    ? last.id
    : '__start__';

}

function loadLayer() {

  const key =
    currentLayerKey();

  let suggestions =
    SUGGESTIONS[key] || [];

  

  const customWords =
    STATE.data.customWords
      .filter(word =>
        !suggestions.includes(word.id)
      )
      .map(word => word.id);

  const combined =
    suggestions.concat(customWords);

  STATE.options =
    combined.filter(
      id => wordById(id)
    );

  if (
    STATE.carouselIndex >=
    STATE.options.length
  ) {

    STATE.carouselIndex = 0;

  }

}

function moveCarousel(delta) {

  if (
    STATE.options.length === 0
  ) {

    return;

  }

  const total =
    STATE.options.length;

  STATE.carouselIndex =
    (
      STATE.carouselIndex +
      delta +
      total
    ) % total;

  render();

}

function confirmSelection() {

  if (
    STATE.options.length === 0
  ) {

    showToast(
      'Não há mais opções.'
    );

    return;

  }

  const id =
    STATE.options[
      STATE.carouselIndex
    ];

  const word =
    wordById(id);

  if (!word) return;

  STATE.phrase.push(word);

  if (STATE.phrase.length === 3) {
    setTimeout(() => {
      speak(currentPhraseText());
    }, 250);
  } else {
    speak(word.label);
  }

  STATE.carouselIndex = 0;

  loadLayer();

  render();

}

function speakPhrase() {

  const text =
    currentPhraseText();

  if (text) {

    speak(text);

  }

}



function isFavoriteWord(wordId) {
  return STATE.data.favWords.includes(wordId);
}

function toggleFavoriteWord(wordId) {
  const index = STATE.data.favWords.indexOf(wordId);

  if (index >= 0) {
    STATE.data.favWords.splice(index, 1);
    showToast('Palavra removida dos favoritos.');
  } else {
    STATE.data.favWords.push(wordId);
    showToast('Palavra adicionada aos favoritos ⭐');
  }

  saveData();
  render();
}

function wordCardHtml(word, selected = false) {
  const favorite = isFavoriteWord(word.id);

  return `
    <div class="word-card ${selected ? 'selected' : ''}" data-word="${word.id}">
      <button type="button" class="favorite-toggle ${favorite ? 'is-favorite' : ''}"
        data-fav-word="${word.id}"
        aria-label="${favorite ? 'Remover dos favoritos' : 'Adicionar aos favoritos'}"
        title="${favorite ? 'Remover dos favoritos' : 'Adicionar aos favoritos'}">
        ${favorite ? '★' : '☆'}
      </button>
      <div class="emoji">${word.emoji}</div>
      <div class="label">${word.label}</div>
      <div class="description">${word.description || 'Toque para adicionar'}</div>
    </div>
  `;
}


function render() {

  const app =
    document.getElementById('app');

  if (!app) return;

  let html = '';

  switch (STATE.screen) {

    case 'login':
      html = renderLogin();
      break;

    case 'chooseProfile':
      html = renderChooseProfile();
      break;

    case 'home':
      html = renderHome();
      break;

    case 'build':
      html = renderBuild();
      break;

    case 'categories':
      html = renderCategories();
      break;

    case 'categoryDetail':
      html = renderCategoryDetail();
      break;

    case 'favorites':
      html = renderFavorites();
      break;

    case 'personalize':
      html = renderPersonalize();
      break;

    case 'challenge':
      html = renderChallenge();
      break;

    case 'profile':
      html = renderProfile();
      break;

    case 'about':
      html = renderAbout();
      break;

    default:
      html = renderHome();

  }

  app.innerHTML = html;

  renderLineIcons();



  if (
    STATE.screen === 'home'
  ) {

    document.body.classList.remove(
      'bg-outras'
    );

  } else {

    document.body.classList.add(
      'bg-outras'
    );

  }

  applyLayoutClass();

  attachHandlers();

}



function applyLayoutClass() {

  const layout =
    STATE.data.profile.layout === 'infantil'
      ? 'infantil'
      : 'neutro';

  document.body.classList.toggle(
    'layout-infantil',
    layout === 'infantil'
  );

  document.body.classList.toggle(
    'layout-neutro',
    layout === 'neutro'
  );

}



function setLayout(layout) {

  STATE.data.profile.layout =
    layout === 'infantil' ? 'infantil' : 'neutro';

  saveData();

  render();

}



function toggleLayout() {

  const current =
    STATE.data.profile.layout === 'infantil'
      ? 'infantil'
      : 'neutro';

  setLayout(
    current === 'infantil' ? 'neutro' : 'infantil'
  );

}

  };

  document.querySelectorAll('.icon-btn').forEach(button => {
    const destination = button.dataset.go;

          )

  const n =
    STATE.options.length;

  let cardsHtml = '';

  if (n === 0) {

    cardsHtml = `

        style="
          color:#fff;

          text-align:center;

  } else {

    const prevId =
      n > 1
        ? STATE.options[
            (
              STATE.carouselIndex -
              1 +
              n

          ]
        : null;

    const nextId =
      n > 1
        ? STATE.options[
            (
              STATE.carouselIndex +
              1
            ) % n
          ]
        : null;

    const curId =
      STATE.options[
        STATE.carouselIndex
      ];

    const sideCard =
      id => {

        if (!id) {

          return `
            <div
              class="carousel-card side empty"
            ></div>
          `;

        }

        const word =
          wordById(id);

        if (!word) {

          return `
            <div
              class="carousel-card side empty"
            ></div>
          `;

        }

        return `

          <div
            class="carousel-card side"
            data-pick="${id}"
          >

            <div class="emoji">
              ${word.emoji}
            </div>

            <div class="label">
              ${word.label}
            </div>

          </div>

    const centerCard =
      id => {

        const word =
          wordById(id);

        if (!word) return '';

        return `

          <div
            class="carousel-card center"
            data-pick="${id}"
          >

function renderChallenge() {

  if (!STATE.challenge) {

    STATE.challenge =
      CHALLENGES[
        Math.floor(
          Math.random() *
          CHALLENGES.length
        )
      ];

    STATE.phrase = [];

  }

  const challenge =
    STATE.challenge;

  const done =
    STATE.phrase.length > 0 &&
    STATE.phrase
      .map(
        word => word.id
      )
      .join(',') ===
      challenge.target.join(',');

  const targetWords =
    allWords().filter(
      word =>
        challenge.target.includes(
          word.id
        )
    );

  const targetCategories =
    new Set(
      targetWords.map(
        word => word.cat
      )
    );

  const distractors =
    allWords()
      .filter(
        word =>
          targetCategories.has(
            word.cat
          ) &&
          !challenge.target.includes(
            word.id
          )
      )
      .slice(0, 5);

  let options =
    targetWords.concat(
      distractors
    );

  options =
    options.sort(
      () =>
        Math.random() - 0.5
    );

  return `

    <div class="topbar">

      <button
        class="icon-btn"
        data-go="home"
      >
        ←
      </button>

      <div class="topbar-title">
        Desafio
      </div>

      <div style="width:44px"></div>

    </div>

    <div class="screen">

      <div class="stars">
        
        ${STATE.data.profile.stars}
        estrelas
      </div>

      <div class="challenge-card">

        <div class="emoji">
          ${challenge.emoji}
        </div>

        <p>
          ${challenge.prompt}
        </p>

      </div>

      <div class="section-label">
        MINHA FRASE
      </div>

      <div class="phrase-bar">

        ${
          STATE.phrase.length

            ? STATE.phrase
                .map(
                  word => `

                    <span class="phrase-chip">
                      ${word.emoji}
                      ${word.label}
                    </span>

                  `
                )
                .join('')

            : `

              <span class="phrase-placeholder">
                Monte a frase certa...
              </span>

            `
        }

      </div>

      <div class="action-row">

        <button
          class="btn-erase"
          id="eraseBtn"
        >
          ⌫ Apagar
        </button>

        <button
          class="btn-clear"
          id="clearBtn"
        >
           Limpar
        </button>

      </div>

      <div class="section-label">
        MONTE A RESPOSTA
      </div>

      <div class="word-grid">

        ${options
          .map(
            word =>
              wordCardHtml(
                word,
                false
              )
          )
          .join('')}

      </div>

      ${
        done

          ? `

            <button
              class="speak-btn"
              id="challengeWinBtn"
            >
               Muito bem! Ganhar estrela
            </button>

          `

          : `

            <button
              class="speak-btn"
              id="speakBtn"
              ${
                STATE.phrase.length
                  ? ''
                  : 'disabled'
              }
            >
               Ouvir minha frase
            </button>

          `
      }

      <div
        class="back-link"
        style="margin-top:14px;"
        id="skipChallenge"
      >
        ↻ Tentar outro desafio
      </div>

    </div>

  `;

}

function prepareKeyboardNavigation() {

  const selector = [
    'button:not([disabled])',
    '[data-go]',
    '[data-word]',
    '[data-category]',
    '[data-pick]',
    '[data-fav-word]',
    '[data-del-word]',
    '[data-del-cat]',
    '[data-profile-type]',
    '.emoji-pick'
  ].join(',');

  document.querySelectorAll(selector).forEach(element => {
    if (element.matches('button, input, select, textarea')) return;

    if (!element.hasAttribute('tabindex')) {
      element.setAttribute('tabindex', '0');
    }

    if (!element.hasAttribute('role')) {
      element.setAttribute('role', 'button');
    }
  });
}


function keyboardTargets() {

  const selector = [
    'button:not([disabled])',
    '[data-go]',
    '[data-word]',
    '[data-category]',
    '[data-pick]',
    '[data-fav-word]',
    '[data-del-word]',
    '[data-del-cat]',
    '[data-profile-type]',
    '.emoji-pick',
    'input:not([disabled])',
    'select:not([disabled])',
    'textarea:not([disabled])'
  ].join(',');

  return [...document.querySelectorAll(selector)].filter(element => {
    const rect = element.getBoundingClientRect();
    return rect.width > 0 && rect.height > 0 && !element.closest('[hidden]');
  });
}


function moveKeyboardFocus(direction) {

  const targets = keyboardTargets();
  const current = document.activeElement;

  if (!targets.length) return;

  if (!targets.includes(current)) {
    targets[0].focus();
    return;
  }

  const index = targets.indexOf(current);

  if (index === -1) {
    targets[0].focus();
    return;
  }

  const goingForward =
    direction === 'ArrowRight' ||
    direction === 'ArrowDown';

  const nextIndex =
    (
      index +
      (goingForward ? 1 : -1) +
      targets.length
    ) % targets.length;

  targets[nextIndex].focus();

}


document.addEventListener('keydown', event => {

  const active = document.activeElement;
  const tag = active?.tagName;

  const isArrow =
    ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']
      .includes(event.key);

  if (tag === 'INPUT' || tag === 'TEXTAREA') {

    if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
      event.preventDefault();
      moveKeyboardFocus(event.key);
      return;
    }

    if (isArrow) {

      const atStart =
        active.selectionStart === 0 &&
        active.selectionEnd === 0;

      const atEnd =
        active.selectionStart === active.value.length &&
        active.selectionEnd === active.value.length;

      const canLeave =
        (event.key === 'ArrowLeft' && atStart) ||
        (event.key === 'ArrowRight' && atEnd);

      if (canLeave) {
        event.preventDefault();
        moveKeyboardFocus(event.key);
      }

      return;

    }

    return;

  }

  if (tag === 'SELECT') {

    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      moveKeyboardFocus(event.key);
    }

    return;

  }

  if (event.defaultPrevented) return;

  if (isArrow) {
    event.preventDefault();
    moveKeyboardFocus(event.key);
    return;
  }

  if (
    (event.key === 'Enter' || event.key === ' ') &&
    document.activeElement?.matches('[role="button"]:not(button)')
  ) {
    event.preventDefault();
    document.activeElement.click();
  }
});



document.addEventListener(
  'keydown',
  event => {

    if (event.defaultPrevented) {
      return;
    }

    

    if (
      STATE.screen !== 'build'
    ) {

      return;

    }

   

    const tag =
      document.activeElement
        ?.tagName;

    if (
      tag === 'INPUT' ||
      tag === 'TEXTAREA' ||
      tag === 'SELECT'
    ) {

      return;

    }

    if (
      event.key === 'ArrowLeft'
    ) {

      event.preventDefault();

      moveCarousel(-1);

    }

    else if (
      event.key === 'ArrowRight'
    ) {

      event.preventDefault();

      moveCarousel(1);

    }

    else if (
      event.key === 'Enter' ||
      event.key === ' '
    ) {

      const focused =
        document.activeElement;

   
      if (
        focused &&
        focused.tagName === 'BUTTON'
      ) {

        return;

      }

      event.preventDefault();

      confirmSelection();

    }

    else if (
      event.key === 'Backspace'
    ) {

      event.preventDefault();

      eraseLast();

    }

    else if (
      event.key === 'Escape'
    ) {

      event.preventDefault();

      clearPhrase();

    }

  }
);


loadData();
